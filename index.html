<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Fractal Noise Visualization</title>
    <style>
      body {
          margin: 0;
          overflow: hidden;
      }
      #ui-bar {
          position: absolute;
          top: 10px;
          left: 10px;
          display: flex;
          height: 30px;
          align-items: stretch;
          gap: 8px;
          background: transparent;       /* ← 背景透明化 */
          z-index: 10;                   /* ← コンテンツ上に配置 */
      }
      
      #gui,
      #hide-ui {
          display: flex;
          align-items: center;           /* ← 垂直中央に寄せる */
          border-radius: 8px;
          background: rgba(0, 0, 0, 0.5);
          color: white;
          font-size: 1em;
          line-height: 1.2;
          padding: 0 12px;               /* ← 上下paddingは0、左右だけ */
          height: 100%;
          box-sizing: border-box;        /* ← padding含めて高さ50px */
          border: none;
      }
    </style>
</head>
<body>
  <div id="ui-bar">
    <div id="gui" class="ui-element">
      <label for="pattern-type">Pattern:&nbsp;&nbsp; </label>
      <select id="pattern-type">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>
    <button class="ui-element" id="hide-ui">hide UI</button>
  </div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
